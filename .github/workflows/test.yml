name: Tests & Linting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, openssl, simplexml, dom
          coverage: none

      - name: Lint PHP Files
        run: |
          find . -type f -name "*.php" -not -path "*/vendor/*" -not -path "*/build/*" -exec php -l {} \;

      - name: Run Unit Tests
        run: |
          php tests/run_tests.php
